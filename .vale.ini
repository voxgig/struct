# Prose gate. Runs over the reader-facing pages in CI; see
# .github/workflows/docs.yml and STYLE-GUIDE.md.
#
# Precedence, decided deliberately and recorded in the style guide:
#
#   house voice  ->  Google  ->  Vale defaults
#
# Google (developers.google.com/style) is the base for everything the
# house guide is silent on. Where the two collide the house voice wins,
# and every such override is listed below with its reason and the count it
# produced on a clean run, so a reader who wonders why a Google rule is
# off finds the answer here rather than guessing it is an oversight.
#
# CARRIED FROM voxgig/jostraca, which shares an author and a house voice
# with this repository. The structure and the reasoning are that project's;
# the levels are not, because every one of them was re-measured against
# these pages. A level copied without measuring is a level nobody can
# defend later.
StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = Struct
# PINNED BY URL, not by name. `Packages = Google` resolves to whatever the
# package registry serves at sync time, so a Google release could add or
# change an error-level rule and turn an unrelated docs pull request red --
# exactly the nondeterminism pinning the BINARY was supposed to prevent.
# Pinning one without the other prevented half of it.
#
# v0.7.1 is the release every count in this file was measured against.
Packages = https://github.com/errata-ai/Google/releases/download/v0.7.1/Google.zip

[*.md]
BasedOnStyles = Vale, Google, Struct

# WHAT THE GATE READS. The reader-facing set is the root README.md and
# DOCS.md plus each port's README.md and DOCS.md -- 50 pages, and the
# CI invocation names them rather than passing a directory, because this
# repository has no single documentation folder to hand the binary.
#
# design/ is NOT in that set. It holds the cross-port specifications and
# the working documents, and the section at the bottom of this file
# switches every style off for it. build/ and test/ are harness
# documentation for maintainers and are out of scope for the same reason.
#
# Documentation must not CITE the working documents among those either. A
# link out of a page into a plan or an agent instruction file strands the
# reader in material written for somebody else and revised on somebody
# else's schedule. That rule is tools/check_prose.py `internal-documents`,
# not a Vale rule, because Vale cannot tell a working document from a
# specification and this project keeps both under one directory.

# --- Overrides where the house voice wins ------------------------------
#
# The register is Richard Rodger's blog voice, not neutral vendor docs.
# These rules encode Google's house style, not correctness, and each one
# would flatten a voice choice the guide makes on purpose.

# THE EM DASH IS SPACED HERE. Google rules it unspaced, and upstream
# follows Google. This project does not, and the divergence is a
# convention rather than drift: 589 spaced dashes across the reader-facing
# pages and NOT ONE unspaced, measured before this line was written. That
# is the same call as the -ise spellings in accept.txt -- the house voice
# is not US English -- and rewriting 589 of them to satisfy a rule the
# prose has never once broken would be the tail wagging the dog.
#
# The convention is still enforced, just not by this rule:
# tools/check_prose.py `em-dashes-are-spaced` fails an unspaced dash, and
# `em-dashes-are-rationed` carries the one-aside-per-line ration that
# Google has no rule for at all.
Google.EmDash = NO

# "We" is allowed in TUTORIAL SECTIONS ONLY, where the page walks through
# code with the reader (STYLE-GUIDE.md, voice rule 7). Vale cannot express
# "only in section 1 of a file", so the rule is off here and the
# restriction is carried by tools/check_prose.py
# `we-appears-only-in-tutorials`, which reads the section headings.
Google.We = NO

# "I" appears nowhere in the docs by house rule, which is STRICTER than
# Google's. tools/check_prose.py `first-person-singular` covers it,
# including `my` and `mine`; this rule also fires on "me" inside quoted
# output, so it is off here.
#
# Upstream records that both of these lines were once here claiming an
# enforcement that did not exist, and that writing the tests found live
# violations both gates had been blind to. The named checks were written
# first here, for that reason: switching a Google rule off in favour of a
# house rule means the house rule has to be real.
Google.FirstPerson = NO

# THE VOCABULARY IS NOT A CASING RULE. `Vale.Terms` reads every entry in
# accept.txt as a canonical spelling and demands the docs match its
# casing, which turns a file whose whole job is to widen the spelling
# dictionary into a rule that narrows it. 445 alerts on a clean run, every
# one of them false and several actively wrong: "Use 'a' instead of 'A'"
# (182), "Use 'OR' instead of 'or'" (175), "Use 'struct' instead of
# 'Struct'" (34) -- where this project writes Struct for the library and
# `struct` for the C keyword, on purpose, in the same paragraph.
#
# accept.txt still brackets the casings that occur both ways, so the file
# is accurate about what it accepts whether or not this rule is on.
Vale.Terms = NO

# US convention: commas and periods INSIDE the quotation marks. The house
# voice is not US English, and putting a period inside a quoted `code
# span` is actively wrong when the quote is a literal. 25 hits.
Google.Quotes = NO

# The house voice alternates long explanatory sentences with short
# verdicts, and the occasional passive is how a sentence keeps its subject
# on the thing being documented ("the value is overwritten"). 256 hits,
# almost all of them fine. Advisory only, never a gate.
Google.Passive = suggestion

# Contractions are a register choice per document kind, not a rule:
# tutorials contract, reference sections do not. 106 hits, none of them
# defects. Advisory only.
Google.Contractions = suggestion

# --- The gate ----------------------------------------------------------
#
# Everything below is error-level and fails CI. These are the rules that
# carry no voice cost: conventions a reader benefits from and an author
# has no reason to vary.
Vale.Spelling = error
Google.Spelling = error
Google.OxfordComma = error
Google.Spacing = error
Google.Anthropomorphism = error
Google.ExcessiveClaims = error
Google.Ellipses = error
Struct.WordChoice = error

# --- Demoted on evidence, not on taste --------------------------------
#
# Each of these was run at error level against the real pages first. They
# are warnings because they were WRONG here, not because they were
# inconvenient; the count is what each produced on a clean run.

# "Use parentheses judiciously" is advice, not a rule, and the house guide
# already rations them more precisely than this can (voice rule 4:
# definitions, caveats, and at most one dry aside per section). 650 hits,
# the largest single count in the whole run, and the reference tables that
# produce most of them are parenthesising types and defaults.
Google.Parens = warning

# Semicolons in a reference sentence that lists conditions are doing the
# job a comma cannot. 376 hits and no defect among the ones read.
Google.Semicolons = warning

# Wants NUL, POSIX, ISO, UTF and JSON spelled out on first use. The
# audience is people porting a data library into 24 languages; padding the
# prose with "Portable Operating System Interface" would serve nobody. 180
# hits, all of them standard terms for this reader.
Google.Acronyms = warning

# Maps `touch` to `tap`, a mobile-UI rule, and objects to casings this
# project states deliberately (`snake_case`, `camelCase`, `getpath`). 143
# hits. The three substitutions from this rule that do hold are carried at
# error level by Struct.WordChoice.
Google.WordListCase = warning

# Flags "Regex API (6)" and "Struct for Rust — Comprehensive Guide" as not
# sentence case. The rule cannot know that Regex, Rust and Struct are
# proper nouns here. 77 hits, sampled and found false.
Google.Headings = warning

# Wants "for example" for `e.g.`. 30 hits, and all 30 are inside
# parentheses or table cells in reference material, where the two-letter
# form is what keeps a cell to one line. Prose outside a parenthesis
# should still say "for example"; that is a review matter, not a gate.
Google.Latin = warning

# Objects to "camelCase" as jargon. It is the name of a casing convention
# this project has to talk about to describe what each port renames. 8
# hits, all of them the word naming itself.
Google.Jargon = warning

# Wants "command-line tool" for CLI. 6 hits, every one in boru's pages
# about a command-line tool whose own documentation calls it a CLI.
Google.WordList = warning

# Flags an `-ly` adverb before a hyphen ("newly-created"), a real error
# class -- but it cannot tell an adverb from a word that merely ends in
# those two letters. 4 hits: `supply-chain` is a false positive, and
# `strongly-typed`, `publicly-set` and `separately-registered` are real
# and were fixed. Left at warning because the false positive is the
# structural one and will recur.
Google.LyHyphens = warning

Google.Will = warning

# --- The working documents and the harness -----------------------------
#
# design/ holds two kinds of file and the gate reads neither. The
# specifications (REGEX*.md, UNDEF*.md, TESTSPEC_MODEL.md) and the parity
# matrix (REPORT.md) are normative and freely citable, but they are
# reference material rather than authored pages -- tables, grammars and
# generated matrices, where the voice rules do not apply. The rest
# (NOTES.md, DOC_EXAMPLES.md, and the assessments and backport notes) are
# working documents. build/ and test/ are harness documentation.
# EMPTY, not the word NONE. `BasedOnStyles = NONE` is what upstream's
# comment describes and it is a runtime error -- "style 'NONE' does not
# exist on StylesPath" -- which takes the whole run down rather than
# skipping a directory. An empty value is the form that works.
#
# These sections are a safety net rather than the mechanism. The gate is
# invoked on an explicit file list, printed by `tools/check_prose.py
# --files`, so that the Vale gate and the check_prose gate cannot read
# different sets of pages; the sections are what stops a bare `vale .`
# from reporting on material no one intended it to read.
[design/**]
BasedOnStyles =

[build/**]
BasedOnStyles =

[test/**]
BasedOnStyles =
