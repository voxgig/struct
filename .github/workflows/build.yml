  test-lean:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # No omni checkout: `make omni-fetch` takes Omni.lean from the
      # lean/v0.1.0 tag and refuses a tag that no longer resolves to the
      # pinned sha. Its override is $OMNI_LOCAL, which nothing else sets -
      # deliberately not $OMNI_HOME, so an ambient one cannot defeat the pin.
      # elan directly rather than leanprover/lean-action: that action is a
      # composite that references actions/cache/restore@v5 and
      # actions/cache/save@v5 BY TAG internally, and the SHA-pin rule applies
      # transitively - "The action actions/cache/restore@v5 is not allowed in
      # voxgig/struct because all actions must be pinned to a full-length
      # commit SHA." No version of it pins its own internals, `main` included,
      # so there is nothing to upgrade to.
      #
      # The action was only installing the toolchain here anyway (test and
      # lint are both false), and lean/Makefile already puts ~/.elan/bin on
      # PATH. elan reads ./lean-toolchain and fetches the pinned Lean on first
      # `lake` invocation, so behaviour is unchanged.
      - name: Install Lean toolchain (elan)
        shell: bash
        env:
          ELAN_VERSION: 'v4.2.3'
          ELAN_SHA256_LINUX: 'df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2'
          ELAN_SHA256_MACOS: '7cae4c03b2f0de4053fb04a91359d5804551e6e37a6ddd1b2e0097dc561ae4a9'
          ELAN_SHA256_WINDOWS: 'be5e92a2dfdd8176099b2db0b810c27237c9054f1e5db1126f4f2a1134773b25'
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Linux)   asset=elan-x86_64-unknown-linux-gnu.tar.gz; sha="$ELAN_SHA256_LINUX" ;;
            macOS)   asset=elan-aarch64-apple-darwin.tar.gz;     sha="$ELAN_SHA256_MACOS" ;;
            Windows) asset=elan-x86_64-pc-windows-msvc.zip;      sha="$ELAN_SHA256_WINDOWS" ;;
            *) echo "unsupported runner: $RUNNER_OS" >&2; exit 1 ;;
          esac
          archive="$RUNNER_TEMP/$asset"
          curl -sSfL --retry 5 --retry-delay 5 --retry-all-errors \
            -o "$archive" \
            "https://github.com/leanprover/elan/releases/download/$ELAN_VERSION/$asset"
          # macOS runners have shasum, not sha256sum.
          if command -v sha256sum >/dev/null 2>&1; then
            echo "$sha  $archive" | sha256sum -c -
          else
            echo "$sha  $archive" | shasum -a 256 -c -
          fi
          mkdir -p "$RUNNER_TEMP/elan"
          if [ "${asset##*.}" = zip ]; then
            7z x -o"$RUNNER_TEMP/elan" "$archive" >/dev/null
          else
            tar -xzf "$archive" -C "$RUNNER_TEMP/elan"
          fi
          "$RUNNER_TEMP/elan/elan-init" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install make (Windows)
        if: runner.os == 'Windows'
        run: choco install make -y
      - name: Run tests
        working-directory: ./lean
        shell: bash
        run: make test

  # boru had no CI job at all, which is how the port spent two days broken on
  # an engine rename without anyone noticing (boru/AGENTS.md records it). This
  # is that job.
  #
  # HELD INACTIVE 2026-09-04, alongside the root Makefile's HOLD. The body
  # below is intact and unchanged: delete the `if: false` to bring it back.
  # Be clear about what the hold costs, because this job used to be held
  # DELIBERATELY OPEN for exactly one reason -- with it skipped, nothing
  # exercises the port against a moving engine, and the two-day silent
  # breakage described above can recur. Accepted for the moment: boru is
  # inactive everywhere until boru-lang/boru ships a release.
  test-boru:
    if: false
    runs-on: ubuntu-latest
    # The corpus is interpreted, one entry at a time, by a language with no
    # JIT: the whole run is minutes, not seconds. That is the cost of covering
    # the port at all, and it is paid on one runner rather than a matrix.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The boru CLI has no release channel of any kind: no tags, no published
      # binaries, and no `go install` (cmd/go is a module of its own whose
      # go.mod carries `replace` directives into sibling modules, which go
      # install refuses outright). Building from a pinned commit is the only
      # reproducible version there is - and the pin is what makes a green run
      # here mean something, exactly as OMNI_REF does above. Bump this one line
      # to take a newer engine, and run `cd boru && make test` locally first:
      # the engine moves under this port more than under any other.
      - name: Checkout boru-lang/boru (the engine)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: boru-lang/boru
          path: .boru-lang
          ref: 8181f78fae7cd335ae3a3513507c7474b5f03663
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.24'
      - name: Build the boru CLI
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/.boru-lang/cmd/go"
          go build -o "$RUNNER_TEMP/boru" ./boru
          # `sed -n 1p`, NOT `head -1`: head exits after the first line and
          # closes the pipe, so `boru help` dies of SIGPIPE writing the rest -
          # exit 141, which the `set -o pipefail` above then promotes to a
          # step failure even though the build and the CLI are both fine.
          # Measured: that is exactly how this job first failed on main. sed
          # drains its input, so there is nothing to signal, and pipefail
          # still catches a real failure of the CLI. Do not add `;q` to it.
          # (The `perl -V | head -1` step above is safe because its block
          # does NOT set pipefail - bash -e alone reports head's status.)
          "$RUNNER_TEMP/boru" help | sed -n '1p'
      # The corpus runner is voxgig/omni, consumed as a local checkout - boru
      # has no registry to publish it to. The Makefile resolves OMNI_HOME into
      # the `.omni-runner` symlink the suite imports through.
      - name: Checkout voxgig/omni (test runner)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: voxgig/omni
          path: .omni
          ref: ${{ env.OMNI_REF }}
      # Lint first: it needs no omni and no corpus, so a static-checker
      # regression is reported in seconds instead of after the whole run.
      - name: Lint
        working-directory: ./boru
        run: make lint BORU="$RUNNER_TEMP/boru"
      - name: Test
        working-directory: ./boru
        env:
          OMNI_HOME: ${{ github.workspace }}/.omni
        run: make test BORU="$RUNNER_TEMP/boru"
