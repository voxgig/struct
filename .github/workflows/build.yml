name: Build and Test

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

permissions:
  contents: read

env:
  # actions/checkout and the setup-* actions still bundle the deprecated
  # Node 20 runtime; opt them into Node 24 now (default from 2026-06-02).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-typescript:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [24, latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        working-directory: ./typescript
        run: npm install
      - name: Build
        working-directory: ./typescript
        run: npm run build
      - name: Run tests
        working-directory: ./typescript
        run: npm test

  test-javascript:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ['24', 'latest']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The test runner is voxgig/omni, consumed as a local checkout (it is
      # not published); the tests find it via OMNI_HOME. The library itself
      # never depends on omni.
      - name: Checkout voxgig/omni (test runner)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: voxgig/omni
          path: .omni
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        working-directory: ./javascript
        run: npm install
      - name: Run tests
        working-directory: ./javascript
        run: npm test
        env:
          OMNI_HOME: ${{ github.workspace }}/.omni

  test-python:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The test runner is voxgig/omni, consumed as a local checkout (it is
      # not published); the tests find it via OMNI_HOME. The library itself
      # never depends on omni.
      - name: Checkout voxgig/omni (test runner)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: voxgig/omni
          path: .omni
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        working-directory: ./python
        run: python -m unittest discover -s tests
        env:
          OMNI_HOME: ${{ github.workspace }}/.omni

  test-go:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # go/go.mod declares `go 1.23`; older toolchains cannot compile it.
        go-version: ['1.23', '1.24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The test runner is voxgig/omni, consumed as a local checkout (it is
      # not published); Go reaches it through a workspace. The library
      # itself never depends on omni.
      - name: Checkout voxgig/omni (test runner)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: voxgig/omni
          path: .omni
      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go-version }}
      # `go work init` rather than `make`, so this works unchanged on the
      # windows leg of the matrix.
      - name: Workspace
        working-directory: ./go
        run: go work init . ${{ github.workspace }}/.omni/go
      - name: Build
        working-directory: ./go
        run: go build ./...
      - name: Run tests
        working-directory: ./go
        run: go test -count=1 -v ./...

  test-ruby:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Install dependencies
        working-directory: ./ruby
        run: |
          gem install bundler
          bundle install
      - name: Run tests
        working-directory: ./ruby
        run: ruby test_voxgig_struct.rb

  test-php:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
      - name: Install dependencies
        working-directory: ./php
        # setup-php intermittently writes a malformed github-oauth token to its
        # auth.json; a fresh COMPOSER_HOME sidesteps it (no auth needed here).
        run: composer install
        env:
          COMPOSER_HOME: ${{ runner.temp }}/composer-home
      - name: Run tests
        working-directory: ./php
        run: vendor/bin/phpunit

  test-rust:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Build
        working-directory: ./rust
        run: cargo build --all-targets
      - name: Run tests
        working-directory: ./rust
        run: cargo test

  test-csharp:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '8.0.x'
      - name: Run tests
        working-directory: ./csharp/tests
        run: dotnet test

  test-kotlin:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java-version: ['17']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Java ${{ matrix.java-version }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
      - name: Run tests (Unix)
        if: runner.os != 'Windows'
        working-directory: ./kotlin
        run: ./gradlew test
      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        working-directory: ./kotlin
        shell: pwsh
        run: .\gradlew.bat test

  test-java:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java-version: ['17']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Java ${{ matrix.java-version }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
      - name: Run tests
        working-directory: ./java
        run: mvn -q test

  test-lua:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Lua
        uses: leafo/gh-actions-lua@6919171ccf181b826f44b9bca76307b577217377 # v13
        with:
          luaVersion: "5.4"
      - name: Setup LuaRocks
        uses: leafo/gh-actions-luarocks@35d062def313a7699a0d513e996bcf4352f05389 # v6
      - name: Setup environment
        working-directory: ./lua
        shell: bash
        run: |
          chmod +x setup.sh
          ./setup.sh
      - name: Run tests
        working-directory: ./lua
        run: make test

  test-zig:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Pin macOS to macos-14: zig 0.13 cannot link against the macOS 26
        # SDK now shipped by macos-latest (undefined libc symbols such as
        # _getcwd/_malloc), and even the Command Line Tools SDK on that image
        # is too new. macos-14 (arm64, SDK 14) is the last image zig 0.13 links.
        os: [ubuntu-latest, macos-14, windows-latest]
        zig-version: ['0.13.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Zig ${{ matrix.zig-version }}
        uses: mlugg/setup-zig@53fc45b17fe98b52f92ee5ea08ff48a85a3e7eb7 # v1
        with:
          version: ${{ matrix.zig-version }}
      # zig 0.13 cannot link against the newer Xcode SDK on macOS runners
      # (undefined libc symbols); the Command Line Tools SDK still works.
      - name: Use Command Line Tools SDK (macOS)
        if: runner.os == 'macOS'
        run: echo "DEVELOPER_DIR=/Library/Developer/CommandLineTools" >> "$GITHUB_ENV"
      - name: Build and test
        working-directory: ./zig
        shell: bash
        run: |
          # Zig test framework crashes with signal 11 during cleanup after all
          # tests pass (known *MapRef/*ListRef arena teardown issue). Treat
          # "N/N tests passed" as success regardless of cleanup exit code.
          # `--summary all` is required: without it, plain `zig build test`
          # prints `test success` with no count and the N/N grep below fails.
          out=$(zig build test --summary all 2>&1) || true
          echo "$out"
          passed=$(echo "$out" | grep -oE '[0-9]+/[0-9]+ tests passed' | head -1)
          if [ -n "$passed" ]; then
            x=$(echo "$passed" | cut -d/ -f1)
            y=$(echo "$passed" | cut -d/ -f2 | cut -d' ' -f1)
            if [ "$x" = "$y" ] && [ "$x" -gt 0 ]; then
              exit 0
            fi
          fi
          exit 1

  test-cpp:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install nlohmann/json (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nlohmann-json3-dev
      - name: Install nlohmann/json (macOS)
        if: runner.os == 'macOS'
        run: brew install nlohmann-json
      - name: Run tests
        working-directory: ./cpp
        run: make test

  test-perl:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Perl (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y perl
      - name: Setup Perl (macOS)
        if: runner.os == 'macOS'
        run: |
          # macOS runners ship perl + prove; nothing to install. The port
          # has zero non-core runtime deps.
          perl -V | head -1
      - name: Run tests
        working-directory: ./perl
        run: prove -Ilib t/

  test-swift:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # macOS runners ship a recent Swift toolchain (6.x) with Xcode by
      # default; `swift-actions/setup-swift@v2`'s macOS download path is
      # not reliable for 6.0.2 specifically. Only install on Linux.
      - name: Setup Swift (Linux)
        if: runner.os == 'Linux'
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2
        with:
          swift-version: '6.0.2'
      - name: Swift version
        run: swift --version
      - name: Run tests
        working-directory: ./swift
        run: swift test --enable-test-discovery

  test-c:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run tests
        working-directory: ./c
        run: make test

  test-scala:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: VirtusLab/scala-cli-setup@c2c917d5764319353961bc4e53885c62d3a95db1 # v1
      - name: Install make (Windows)
        if: runner.os == 'Windows'
        run: choco install make -y
      - name: Run tests
        working-directory: ./scala
        shell: bash
        run: make test

  test-clojure:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: DeLaGuardo/setup-clojure@4c7a6f613e5089821bb3bb2a33a3ee115578580d # 13
        with:
          cli: latest
      - name: Install make (Windows)
        if: runner.os == 'Windows'
        run: choco install make -y
      - name: Run tests
        working-directory: ./clojure
        shell: bash
        run: make test

  test-dart:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
      - name: Install make (Windows)
        if: runner.os == 'Windows'
        run: choco install make -y
      - name: Run tests
        working-directory: ./dart
        shell: bash
        run: dart pub get && make test

  test-elixir:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # erlef/setup-beam supports Ubuntu + Windows only; use Homebrew on macOS.
      - name: Setup Elixir (setup-beam)
        if: runner.os != 'macOS'
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: '27'
          elixir-version: '1.18'
      - name: Setup Elixir (Homebrew, macOS)
        if: runner.os == 'macOS'
        run: brew install elixir
      - name: Install make (Windows)
        if: runner.os == 'Windows'
        run: choco install make -y
      - name: Run tests
        working-directory: ./elixir
        shell: bash
        run: make test

  test-haskell:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: haskell-actions/setup@6037f33647c3f17758a2356c80fc4a53d7e0685d # v2
        with:
          ghc-version: '9.10'
      - name: Install make (Windows)
        if: runner.os == 'Windows'
        run: choco install make -y
      - name: Run tests
        working-directory: ./haskell
        shell: bash
        run: make test

  test-ocaml:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ocaml/setup-ocaml@605a7e998e76e035b82c14d618a6e1010732c4ce # v3
        with:
          ocaml-compiler: '5'
      - name: Install make (Windows)
        if: runner.os == 'Windows'
        run: choco install make -y
      - name: Run tests
        working-directory: ./ocaml
        shell: bash
        # ocamlc lives in the opam switch; opam exec puts it on PATH.
        run: opam exec -- make test

  test-lean:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1
        with:
          lake-package-directory: ./lean
          test: false
          lint: false
      - name: Install make (Windows)
        if: runner.os == 'Windows'
        run: choco install make -y
      - name: Run tests
        working-directory: ./lean
        shell: bash
        run: make test
