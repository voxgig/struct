name: Build and Test

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

permissions:
  contents: read

env:
  # actions/checkout and the setup-* actions still bundle the deprecated
  # Node 20 runtime; opt them into Node 24 now (default from 2026-06-02).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-typescript:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [24, latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        working-directory: ./typescript
        run: npm install
      - name: Build
        working-directory: ./typescript
        run: npm run build
      - name: Run tests
        working-directory: ./typescript
        run: npm test

  test-javascript:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ['24', 'latest']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The test runner is voxgig/omni, consumed as a local checkout (it is
      # not published); the tests find it via OMNI_HOME. The library itself
      # never depends on omni.
      - name: Checkout voxgig/omni (test runner)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: voxgig/omni
          path: .omni
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        working-directory: ./javascript
        run: npm install
      - name: Run tests
        working-directory: ./javascript
        run: npm test
        env:
          OMNI_HOME: ${{ github.workspace }}/.omni

  test-python:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The test runner is voxgig/omni, consumed as a local checkout (it is
      # not published); the tests find it via OMNI_HOME. The library itself
      # never depends on omni.
      - name: Checkout voxgig/omni (test runner)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: voxgig/omni
          path: .omni
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        working-directory: ./python
        run: python -m unittest discover -s tests
        env:
          OMNI_HOME: ${{ github.workspace }}/.omni

  test-go:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # go/go.mod declares `go 1.23`; older toolchains cannot compile it.
        go-version: ['1.23', '1.24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The test runner is voxgig/omni, consumed as a local checkout (it is
      # not published); Go reaches it through a workspace. The library
      # itself never depends on omni.
      - name: Checkout voxgig/omni (test runner)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: voxgig/omni
          path: .omni
      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go-version }}
      # `go work init` rather than `make`, so this works unchanged on the
      # windows leg of the matrix.
      - name: Workspace
        working-directory: ./go
        run: go work init . ./testutil ${{ github.workspace }}/.omni/go
      - name: Build
        working-directory: ./go
        run: go build ./...
      - name: Run tests
        working-directory: ./go
        run: go test -count=1 -v ./... ./testutil/...

  test-ruby:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The test runner is voxgig/omni, consumed as a local checkout (it is
      # not published); the tests find it via OMNI_HOME. The library itself
      # never depends on omni.
      - name: Checkout voxgig/omni (test runner)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: voxgig/omni
          path: .omni
      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Install dependencies
        working-directory: ./ruby
        run: |
          gem install bundler
          bundle install
      - name: Run tests
        working-directory: ./ruby
        run: ruby test_voxgig_struct.rb
        env:
          OMNI_HOME: ${{ github.workspace }}/.omni

  test-php:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
      - name: Install dependencies
        working-directory: ./php
        # setup-php intermittently writes a malformed github-oauth token to its
        # auth.json; a fresh COMPOSER_HOME sidesteps it (no auth needed here).
        run: composer install
        env:
          COMPOSER_HOME: ${{ runner.temp }}/composer-home
      # The test runner is voxgig/omni, consumed as a local checkout (it is
      # not published to Packagist); the tests find it via OMNI_HOME. The
      # library itself never depends on omni - composer.json gains nothing.
      - name: Checkout voxgig/omni (test runner)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: voxgig/omni
          path: .omni
      - name: Run tests
        working-directory: ./php
        run: vendor/bin/phpunit
        env:
          OMNI_HOME: ${{ github.workspace }}/.omni

  test-rust:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - name: Build
        working-directory: ./rust
        run: cargo build --all-targets
      - name: Run tests
        working-directory: ./rust
        run: cargo test

  test-csharp:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '8.0.x'
      # Register 4.13: the omni reference is on the TEST project only, so the
      # library must still build with no omni checkout present. Checked BEFORE
      # omni is fetched - CI always has it afterwards, which is exactly why no
      # port's CI caught this for go.
      - name: Library builds without omni
        working-directory: ./csharp
        run: dotnet build VoxgigStruct.csproj
      # The test runner is voxgig/omni, consumed as a local checkout (it is
      # not published to NuGet); the tests find it via OMNI_HOME. The library
      # itself never depends on omni.
      - name: Checkout voxgig/omni (test runner)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: voxgig/omni
          path: .omni
      - name: Run tests
        working-directory: ./csharp/tests
        run: dotnet test
        env:
          OMNI_HOME: ${{ github.workspace }}/.omni

  test-kotlin:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java-version: ['17']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Java ${{ matrix.java-version }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
      - name: Run tests (Unix)
        if: runner.os != 'Windows'
        working-directory: ./kotlin
        run: ./gradlew test
      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        working-directory: ./kotlin
        shell: pwsh
        run: .\gradlew.bat test

  test-java:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java-version: ['17']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Java ${{ matrix.java-version }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
      - name: Run tests
        working-directory: ./java
        run: mvn -q test

  test-lua:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Lua
        uses: leafo/gh-actions-lua@6919171ccf181b826f44b9bca76307b577217377 # v13
        with:
          luaVersion: "5.4"
      - name: Setup LuaRocks
        uses: leafo/gh-actions-luarocks@35d062def313a7699a0d513e996bcf4352f05389 # v6
      - name: Setup environment
        working-directory: ./lua
        shell: bash
        run: |
          chmod +x setup.sh
          ./setup.sh
      # The test runner is voxgig/omni, consumed as a local checkout (it is
      # not published to LuaRocks); the tests find it via OMNI_HOME. The
      # library itself never depends on omni - struct.rockspec gains nothing.
      - name: Checkout voxgig/omni (test runner)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: voxgig/omni
          path: .omni
      - name: Run tests
        working-directory: ./lua
        run: make test
        env:
          OMNI_HOME: ${{ github.workspace }}/.omni

  test-zig:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Pin macOS to macos-14: zig 0.13 cannot link against the macOS 26
        # SDK now shipped by macos-latest (undefined libc symbols such as
        # _getcwd/_malloc), and even the Command Line Tools SDK on that image
        # is too new. macos-14 (arm64, SDK 14) is the last image zig 0.13 links.
        os: [ubuntu-latest, macos-14, windows-latest]
        zig-version: ['0.13.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Downloaded straight from ziglang.org rather than via a setup action.
      # Every published zig setup action - mlugg, korandoru, goto-bus-stop -
      # still targets Node 20, which is refused. A pinned tarball with a
      # checked hash is what voxgig/omni's zig job already does, and it also
      # drops setup-zig's community-mirror fallback, which was flaky.
      - name: Setup Zig ${{ matrix.zig-version }}
        shell: bash
        env:
          ZIG_VERSION: ${{ matrix.zig-version }}
          ZIG_SHA256_LINUX: 'd45312e61ebcc48032b77bc4cf7fd6915c11fa16e4aad116b66c9468211230ea'
          ZIG_SHA256_MACOS: '46fae219656545dfaf4dce12fb4e8685cec5b51d721beee9389ab4194d43394c'
          ZIG_SHA256_WINDOWS: 'd859994725ef9402381e557c60bb57497215682e355204d754ee3df75ee3c158'
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Linux)   name="zig-linux-x86_64-$ZIG_VERSION";   ext=tar.xz; sha="$ZIG_SHA256_LINUX" ;;
            macOS)   name="zig-macos-aarch64-$ZIG_VERSION";  ext=tar.xz; sha="$ZIG_SHA256_MACOS" ;;
            Windows) name="zig-windows-x86_64-$ZIG_VERSION"; ext=zip;    sha="$ZIG_SHA256_WINDOWS" ;;
            *) echo "unsupported runner: $RUNNER_OS" >&2; exit 1 ;;
          esac
          archive="$RUNNER_TEMP/zig.$ext"
          curl -sSfL --retry 5 --retry-delay 5 --retry-all-errors \
            -o "$archive" "https://ziglang.org/download/$ZIG_VERSION/$name.$ext"
          # macOS runners have shasum, not sha256sum.
          if command -v sha256sum >/dev/null 2>&1; then
            echo "$sha  $archive" | sha256sum -c -
          else
            echo "$sha  $archive" | shasum -a 256 -c -
          fi
          mkdir -p "$HOME/zig"
          if [ "$ext" = zip ]; then
            7z x -o"$RUNNER_TEMP/zigx" "$archive" >/dev/null
            mv "$RUNNER_TEMP/zigx/$name"/* "$HOME/zig/"
          else
            tar -xJf "$archive" -C "$HOME/zig" --strip-components=1
          fi
          echo "$HOME/zig" >> "$GITHUB_PATH"
      # zig 0.13 cannot link against the newer Xcode SDK on macOS runners
      # (undefined libc symbols); the Command Line Tools SDK still works.
      - name: Use Command Line Tools SDK (macOS)
        if: runner.os == 'macOS'
        run: echo "DEVELOPER_DIR=/Library/Developer/CommandLineTools" >> "$GITHUB_ENV"
      - name: Build and test
        working-directory: ./zig
        shell: bash
        run: |
          # Zig test framework crashes with signal 11 during cleanup after all
          # tests pass (known *MapRef/*ListRef arena teardown issue). Treat
          # "N/N tests passed" as success regardless of cleanup exit code.
          # `--summary all` is required: without it, plain `zig build test`
          # prints `test success` with no count and the N/N grep below fails.
          out=$(zig build test --summary all 2>&1) || true
          echo "$out"
          passed=$(echo "$out" | grep -oE '[0-9]+/[0-9]+ tests passed' | head -1)
          if [ -n "$passed" ]; then
            x=$(echo "$passed" | cut -d/ -f1)
            y=$(echo "$passed" | cut -d/ -f2 | cut -d' ' -f1)
            if [ "$x" = "$y" ] && [ "$x" -gt 0 ]; then
              exit 0
            fi
          fi
          exit 1

  test-cpp:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install nlohmann/json (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nlohmann-json3-dev
      - name: Install nlohmann/json (macOS)
        if: runner.os == 'macOS'
        run: brew install nlohmann-json
      - name: Run tests
        working-directory: ./cpp
        run: make test

  test-perl:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Perl (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y perl
      - name: Setup Perl (macOS)
        if: runner.os == 'macOS'
        run: |
          # macOS runners ship perl + prove; nothing to install. The port
          # has zero non-core runtime deps.
          perl -V | head -1
      - name: Run tests
        working-directory: ./perl
        run: prove -Ilib t/

  test-swift:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # macOS runners ship a recent Swift toolchain (6.x) with Xcode by
      # default; `swift-actions/setup-swift@v2`'s macOS download path is
      # not reliable for 6.0.2 specifically. Only install on Linux.
      - name: Setup Swift (Linux)
        if: runner.os == 'Linux'
        uses: SwiftyLab/setup-swift@38f54a76b70d989321de9dc7c840618c08cf56e9 # v1.14.0
        with:
          swift-version: '6.0.2'
      - name: Swift version
        run: swift --version
      - name: Run tests
        working-directory: ./swift
        run: swift test --enable-test-discovery

  test-c:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run tests
        working-directory: ./c
        run: make test

  test-scala:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: VirtusLab/scala-cli-setup@c2c917d5764319353961bc4e53885c62d3a95db1 # v1
      - name: Install make (Windows)
        if: runner.os == 'Windows'
        run: choco install make -y
      - name: Run tests
        working-directory: ./scala
        shell: bash
        run: make test

  test-clojure:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The test runner is voxgig/omni, consumed as a local checkout (it is
      # not published to Clojars); the Makefile mints an :omni alias for it
      # from OMNI_HOME. The library itself never depends on omni.
      - name: Checkout voxgig/omni (test runner)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: voxgig/omni
          path: .omni
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: DeLaGuardo/setup-clojure@4c7a6f613e5089821bb3bb2a33a3ee115578580d # 13
        with:
          cli: latest
      - name: Install make (Windows)
        if: runner.os == 'Windows'
        run: choco install make -y
      - name: Run tests
        working-directory: ./clojure
        shell: bash
        run: make test
        env:
          OMNI_HOME: ${{ github.workspace }}/.omni

  test-dart:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
      - name: Install make (Windows)
        if: runner.os == 'Windows'
        run: choco install make -y
      - name: Run tests
        working-directory: ./dart
        shell: bash
        run: dart pub get && make test

  test-elixir:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # erlef/setup-beam supports Ubuntu + Windows only; use Homebrew on macOS.
      - name: Setup Elixir (setup-beam)
        if: runner.os != 'macOS'
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: '27'
          elixir-version: '1.18'
      - name: Setup Elixir (Homebrew, macOS)
        if: runner.os == 'macOS'
        run: brew install elixir
      - name: Install make (Windows)
        if: runner.os == 'Windows'
        run: choco install make -y
      - name: Run tests
        working-directory: ./elixir
        shell: bash
        run: make test

  test-haskell:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: haskell-actions/setup@6037f33647c3f17758a2356c80fc4a53d7e0685d # v2
        with:
          ghc-version: '9.10'
      - name: Install make (Windows)
        if: runner.os == 'Windows'
        run: choco install make -y
      - name: Run tests
        working-directory: ./haskell
        shell: bash
        run: make test

  test-ocaml:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ocaml/setup-ocaml@605a7e998e76e035b82c14d618a6e1010732c4ce # v3
        with:
          ocaml-compiler: '5'
      - name: Install make (Windows)
        if: runner.os == 'Windows'
        run: choco install make -y
      - name: Run tests
        working-directory: ./ocaml
        shell: bash
        # ocamlc lives in the opam switch; opam exec puts it on PATH.
        run: opam exec -- make test

  test-lean:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # elan directly rather than leanprover/lean-action: that action is a
      # composite that references actions/cache/restore@v5 and
      # actions/cache/save@v5 BY TAG internally, and the SHA-pin rule applies
      # transitively - "The action actions/cache/restore@v5 is not allowed in
      # voxgig/struct because all actions must be pinned to a full-length
      # commit SHA." No version of it pins its own internals, `main` included,
      # so there is nothing to upgrade to.
      #
      # The action was only installing the toolchain here anyway (test and
      # lint are both false), and lean/Makefile already puts ~/.elan/bin on
      # PATH. elan reads ./lean-toolchain and fetches the pinned Lean on first
      # `lake` invocation, so behaviour is unchanged.
      - name: Install Lean toolchain (elan)
        shell: bash
        env:
          ELAN_VERSION: 'v4.2.3'
          ELAN_SHA256_LINUX: 'df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2'
          ELAN_SHA256_MACOS: '7cae4c03b2f0de4053fb04a91359d5804551e6e37a6ddd1b2e0097dc561ae4a9'
          ELAN_SHA256_WINDOWS: 'be5e92a2dfdd8176099b2db0b810c27237c9054f1e5db1126f4f2a1134773b25'
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Linux)   asset=elan-x86_64-unknown-linux-gnu.tar.gz; sha="$ELAN_SHA256_LINUX" ;;
            macOS)   asset=elan-aarch64-apple-darwin.tar.gz;     sha="$ELAN_SHA256_MACOS" ;;
            Windows) asset=elan-x86_64-pc-windows-msvc.zip;      sha="$ELAN_SHA256_WINDOWS" ;;
            *) echo "unsupported runner: $RUNNER_OS" >&2; exit 1 ;;
          esac
          archive="$RUNNER_TEMP/$asset"
          curl -sSfL --retry 5 --retry-delay 5 --retry-all-errors \
            -o "$archive" \
            "https://github.com/leanprover/elan/releases/download/$ELAN_VERSION/$asset"
          # macOS runners have shasum, not sha256sum.
          if command -v sha256sum >/dev/null 2>&1; then
            echo "$sha  $archive" | sha256sum -c -
          else
            echo "$sha  $archive" | shasum -a 256 -c -
          fi
          mkdir -p "$RUNNER_TEMP/elan"
          if [ "${asset##*.}" = zip ]; then
            7z x -o"$RUNNER_TEMP/elan" "$archive" >/dev/null
          else
            tar -xzf "$archive" -C "$RUNNER_TEMP/elan"
          fi
          "$RUNNER_TEMP/elan/elan-init" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install make (Windows)
        if: runner.os == 'Windows'
        run: choco install make -y
      - name: Run tests
        working-directory: ./lean
        shell: bash
        run: make test
