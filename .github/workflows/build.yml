name: Build and Test

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

permissions:
  contents: read

env:
  # actions/checkout and the setup-* actions still bundle the deprecated
  # Node 20 runtime; opt them into Node 24 now (default from 2026-06-02).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

  # The corpus runner is voxgig/omni, checked out by every port's job. Pinned
  # to a SHA rather than floating on omni's default branch: unpinned, a run
  # that starts before a paired omni PR merges tests against the OLD omni and
  # stays red until re-run, and a green run here is not reproducible from
  # this repo's commit alone. Bump this one line to take a new omni; that
  # bump is the commit CI re-tests every port against.
  #
  # AND BUMP THE OTHER TWO WITH IT: lint.yml and publish.yml define OMNI_REF
  # too, because github gives workflow files no way to share an `env`. It is
  # one pin written three times. `workflows` in security.yml fails if the
  # three ever disagree.
  OMNI_REF: fbf1da64e3c90fc54e3c6b237b0b5835890df8c4

jobs:
  test-typescript:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [24, latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
      # `npm install`, not `npm ci`: this repo gitignores package-lock.json
      # (.gitignore:150) and commits no lockfile in any port, so there is
      # nothing for `npm ci` to install from. What pins @voxgig/omni is the
      # EXACT version in package.json - "0.1.0", not "^0.1.0", which for a
      # 0.x would float to anything under 0.2.0.
      - name: Install dependencies
        working-directory: ./typescript
        run: npm install
      # The test runner is voxgig/omni, taken from npm as a devDependency.
      # This job used to check omni out as a sibling, build it, and point
      # OMNI_HOME at it; none of that is needed now, and nothing here
      # reaches a checkout.
      - name: Build
        working-directory: ./typescript
        run: npm run build
      # REGISTER 4.13: package.json now names omni, which it never did under
      # the checkout route, so the isolation is asserted rather than assumed.
      # After the build - one of its four checks reads what npm pack would
      # send, which comes off disk.
      - name: omni must not reach the shipped library
        working-directory: ./typescript
        run: node tools/omni-isolation.js
      # Deliberately NO OMNI_HOME. If anything still resolved a checkout,
      # this is where it would show.
      - name: Run tests
        working-directory: ./typescript
        run: npm test

  test-javascript:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ['24', 'latest']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The test runner is voxgig/omni, consumed as a local checkout (it is
      # not published); the tests find it via OMNI_HOME. The library itself
      # never depends on omni.
      - name: Checkout voxgig/omni (test runner)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: voxgig/omni
          path: .omni
          ref: ${{ env.OMNI_REF }}
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        working-directory: ./javascript
        run: npm install
      - name: Run tests
        working-directory: ./javascript
        run: npm test
        env:
          OMNI_HOME: ${{ github.workspace }}/.omni

  test-python:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The test runner is voxgig/omni, consumed as a local checkout (it is
      # not published); the tests find it via OMNI_HOME. The library itself
      # never depends on omni.
      - name: Checkout voxgig/omni (test runner)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: voxgig/omni
          path: .omni
          ref: ${{ env.OMNI_REF }}
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        working-directory: ./python
        run: python -m unittest discover -s tests
        env:
          OMNI_HOME: ${{ github.workspace }}/.omni

  test-go:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # go/go.mod declares `go 1.23`; older toolchains cannot compile it.
        go-version: ['1.23', '1.24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go-version }}
      # Two modules, not three: omni comes from the go/v0.1.0 tag that
      # testutil/go.mod requires, so CI must NOT put a local omni in the
      # workspace. `use` makes a module a root module for the build, which
      # would shadow the requirement and quietly return this job to testing
      # a floating checkout - never verifying that the tag resolves, that
      # its checksums match, or that the released API passes the corpus.
      # `go work init` rather than `make`, so this works unchanged on the
      # windows leg of the matrix.
      - name: Workspace
        working-directory: ./go
        run: go work init . ./testutil
      - name: Build
        working-directory: ./go
        run: go build ./...
      - name: Run tests
        working-directory: ./go
        run: go test -count=1 -v ./... ./testutil/...

  test-ruby:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The test runner is voxgig/omni, consumed as a local checkout (it is
      # not published); the tests find it via OMNI_HOME. The library itself
      # never depends on omni.
      - name: Checkout voxgig/omni (test runner)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: voxgig/omni
          path: .omni
          ref: ${{ env.OMNI_REF }}
      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Install dependencies
        working-directory: ./ruby
        run: |
          gem install bundler
          bundle install
      - name: Run tests
        working-directory: ./ruby
        run: ruby test_voxgig_struct.rb
        env:
          OMNI_HOME: ${{ github.workspace }}/.omni

  test-php:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
      - name: Install dependencies
        working-directory: ./php
        # setup-php intermittently writes a malformed github-oauth token to its
        # auth.json; a fresh COMPOSER_HOME sidesteps it (no auth needed here).
        run: composer install
        env:
          COMPOSER_HOME: ${{ runner.temp }}/composer-home
      # The test runner is voxgig/omni, consumed as a local checkout (it is
      # not published to Packagist); the tests find it via OMNI_HOME. The
      # library itself never depends on omni - composer.json gains nothing.
      - name: Checkout voxgig/omni (test runner)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: voxgig/omni
          path: .omni
          ref: ${{ env.OMNI_REF }}
      - name: Run tests
        working-directory: ./php
        run: vendor/bin/phpunit
        env:
          OMNI_HOME: ${{ github.workspace }}/.omni

  test-rust:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      # Register 4.13: the corpus harness is a separate package (`rust/corpus`)
      # so that omni stays out of the library's manifest. Cargo resolves
      # dev-dependencies even for `cargo build`, so this must pass with omni
      # nowhere in the library's graph - which is now the only state there is,
      # since `corpus/Cargo.toml` takes omni from its `rust/v0.1.0` tag and
      # nothing checks omni out here at all.
      - name: Library builds without omni
        working-directory: ./rust
        run: cargo build --all-targets
      - name: Run tests
        working-directory: ./rust
        run: cargo test
      - name: Run corpus
        working-directory: ./rust/corpus
        run: cargo test

  test-csharp:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '8.0.x'
      # Register 4.13: the omni reference is on the TEST project only, so the
      # library must still build with no omni checkout present. Checked BEFORE
      # omni is fetched - CI always has it afterwards, which is exactly why no
      # port's CI caught this for go.
      - name: Library builds without omni
        working-directory: ./csharp
        run: dotnet build VoxgigStruct.csproj
      # The test runner is voxgig/omni, consumed as a local checkout (it is
      # not published to NuGet); the tests find it via OMNI_HOME. The library
      # itself never depends on omni.
      - name: Checkout voxgig/omni (test runner)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: voxgig/omni
          path: .omni
          ref: ${{ env.OMNI_REF }}
      - name: Run tests
        working-directory: ./csharp/tests
        run: dotnet test
        env:
          OMNI_HOME: ${{ github.workspace }}/.omni

  test-kotlin:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java-version: ['17']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The test runner is voxgig/omni, consumed as a local checkout (it is
      # not published to Maven Central); the build finds it via OMNI_HOME. The
      # library itself never depends on omni - it is not in the published jar.
      - name: Checkout voxgig/omni (test runner)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: voxgig/omni
          path: .omni
          ref: ${{ env.OMNI_REF }}
      - name: Setup Java ${{ matrix.java-version }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
      # The library build must not need omni. Checked BEFORE the tests, since
      # afterwards the checkout is there and the check proves nothing.
      - name: Library builds without omni
        if: runner.os != 'Windows'
        working-directory: ./kotlin
        run: ./gradlew jar
      - name: Run tests (Unix)
        if: runner.os != 'Windows'
        working-directory: ./kotlin
        run: ./gradlew test
        env:
          OMNI_HOME: ${{ github.workspace }}/.omni
      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        working-directory: ./kotlin
        shell: pwsh
        run: .\gradlew.bat test
        env:
          OMNI_HOME: ${{ github.workspace }}/.omni

  test-java:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java-version: ['17']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Java ${{ matrix.java-version }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
      # Register 4.13: omni is a TEST-scoped dependency, so the library builds
      # and packages without it. Checked before omni is fetched.
      #
      # `maven.test.skip` skips test COMPILATION as well as execution, which is
      # the point here: the test sources import omni. QUOTED because Windows
      # runners default to pwsh, which splits the bare token at the first `.`
      # and hands maven `.test.skip=true` as a phase name of its own.
      - name: Library builds without omni
        working-directory: ./java
        run: mvn -q "-Dmaven.test.skip=true" package
      # The test runner is voxgig/omni, consumed as a local checkout (it is not
      # published to Maven Central). `make test` builds its jar and installs it
      # into the local repository, so the pom names an ordinary test dependency.
      - name: Checkout voxgig/omni (test runner)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: voxgig/omni
          path: .omni
          ref: ${{ env.OMNI_REF }}
      - name: Run tests
        working-directory: ./java
        run: make test
        env:
          OMNI_HOME: ${{ github.workspace }}/.omni

  test-lua:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Lua
        uses: leafo/gh-actions-lua@6919171ccf181b826f44b9bca76307b577217377 # v13
        with:
          luaVersion: "5.4"
      - name: Setup LuaRocks
        uses: leafo/gh-actions-luarocks@35d062def313a7699a0d513e996bcf4352f05389 # v6
      - name: Setup environment
        working-directory: ./lua
        shell: bash
        run: |
          chmod +x setup.sh
          ./setup.sh
      # The test runner is voxgig/omni, consumed as a local checkout (it is
      # not published to LuaRocks); the tests find it via OMNI_HOME. The
      # library itself never depends on omni - struct.rockspec gains nothing.
      - name: Checkout voxgig/omni (test runner)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: voxgig/omni
          path: .omni
          ref: ${{ env.OMNI_REF }}
      - name: Run tests
        working-directory: ./lua
        run: make test
        env:
          OMNI_HOME: ${{ github.workspace }}/.omni

  test-zig:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # macos-14 is held over from the 0.13 pin, where the macOS 26 SDK on
        # macos-latest left every libc symbol undefined and macos-14 (arm64,
        # SDK 14) was the last image that linked. 0.16 is expected to handle
        # the newer SDK, but that has not been measured on a runner, so the
        # image moves in its own change rather than inside the version bump.
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # ziglang on PyPI rather than a ziglang.org tarball. It is the Zig
      # Software Foundation's own redistribution of the same builds, and it
      # puts the integrity check in pip instead of a hand-rolled
      # `sha256sum -c`: .github/zig-requirements.txt carries one --hash per
      # platform wheel and both workflows read that one file. It still avoids
      # every published zig setup action (all of them target the refused
      # Node 20) and setup-zig's flaky community-mirror fallback.
      - name: Setup Zig
        shell: bash
        run: |
          set -euo pipefail
          py=python3; command -v python3 >/dev/null 2>&1 || py=python
          # macos-14's python3 is Homebrew's, and Homebrew marks it externally
          # managed: `pip install` there does not warn, it exits 1 (PEP 668,
          # "externally-managed-environment") before zig is ever fetched. A
          # venv is the documented answer and needs no extra action. Scoped to
          # macOS on purpose - the ubuntu and windows legs install into the
          # runner's tool-cache Python, which carries no such marker, and this
          # leaves those two byte-identical.
          if [ "$RUNNER_OS" = macOS ]; then
            "$py" -m venv "$RUNNER_TEMP/zigvenv"
            py="$RUNNER_TEMP/zigvenv/bin/python"
          fi
          "$py" -m pip install --disable-pip-version-check --quiet \
            --require-hashes -r "$GITHUB_WORKSPACE/.github/zig-requirements.txt"
          bin="$RUNNER_TEMP/zigbin"; mkdir -p "$bin"
          printf '#!/bin/sh\nexec %s -m ziglang "$@"\n' "$py" > "$bin/zig"
          chmod +x "$bin/zig"
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/zig" version
      # Held over with the macos-14 pin above: 0.13 could not link against the
      # newer Xcode SDK (undefined libc symbols) and the Command Line Tools SDK
      # still works. Harmless if 0.16 no longer needs it; unmeasured either way.
      - name: Use Command Line Tools SDK (macOS)
        if: runner.os == 'macOS'
        run: echo "DEVELOPER_DIR=/Library/Developer/CommandLineTools" >> "$GITHUB_ENV"
      # The corpus runner is voxgig/omni, consumed as a local checkout. This
      # job did not have one, because until the omni swap the zig port carried
      # its own runner and needed nothing.
      - name: Checkout voxgig/omni (test runner)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: voxgig/omni
          path: .omni
          ref: ${{ env.OMNI_REF }}
      # `make test` rather than `zig build test`: the Makefile resolves the
      # checkout into the `-Domni` build option the test module needs, and it
      # already carries the "N/N tests passed" parsing this step used to
      # duplicate. Without the option there is no `omni` module and the suite
      # does not compile at all.
      - name: Build and test
        working-directory: ./zig
        shell: bash
        env:
          OMNI_HOME: ${{ github.workspace }}/.omni
        run: make test

  test-cpp:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The test runner is voxgig/omni, header-only and consumed as a local
      # checkout (it is not published); the Makefile finds it via OMNI_HOME.
      # The library itself never depends on omni.
      - name: Checkout voxgig/omni (test runner)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: voxgig/omni
          path: .omni
          ref: ${{ env.OMNI_REF }}
      - name: Install nlohmann/json (Linux)
        if: runner.os == 'Linux'
        # apt-get update tolerated: see the note in security.yml.
        run: |
          sudo apt-get update || true
          sudo apt-get install -y nlohmann-json3-dev
      - name: Install nlohmann/json (macOS)
        if: runner.os == 'macOS'
        run: brew install nlohmann-json
      - name: Run tests
        working-directory: ./cpp
        run: make test
        env:
          OMNI_HOME: ${{ github.workspace }}/.omni

  test-perl:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The test runner is voxgig/omni, consumed as a local checkout (it is
      # not published to CPAN); the tests find it via OMNI_HOME. The library
      # itself never depends on omni - Makefile.PL gains nothing.
      - name: Checkout voxgig/omni (test runner)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: voxgig/omni
          path: .omni
          ref: ${{ env.OMNI_REF }}
      - name: Setup Perl (Linux)
        if: runner.os == 'Linux'
        run: |
          # apt-get update tolerated: see the note in security.yml.
          sudo apt-get update || true
          sudo apt-get install -y perl
      - name: Setup Perl (macOS)
        if: runner.os == 'macOS'
        run: |
          # macOS runners ship perl + prove; nothing to install. The port
          # has zero non-core runtime deps.
          perl -V | head -1
      - name: Run tests
        working-directory: ./perl
        run: prove -Ilib t/
        env:
          OMNI_HOME: ${{ github.workspace }}/.omni

  test-swift:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The test runner is voxgig/omni, consumed as a local checkout (it is
      # not published); `make test` points a gitignored symlink at it from
      # OMNI_HOME. The library itself never depends on omni.
      - name: Checkout voxgig/omni (test runner)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: voxgig/omni
          path: .omni
          ref: ${{ env.OMNI_REF }}
      # macOS runners ship a recent Swift toolchain (6.x) with Xcode by
      # default; `swift-actions/setup-swift@v2`'s macOS download path is
      # not reliable for 6.0.2 specifically. Only install on Linux.
      - name: Setup Swift (Linux)
        if: runner.os == 'Linux'
        uses: SwiftyLab/setup-swift@38f54a76b70d989321de9dc7c840618c08cf56e9 # v1.14.0
        with:
          swift-version: '6.0.2'
      - name: Swift version
        run: swift --version
      - name: Run tests
        working-directory: ./swift
        shell: bash
        run: make test
        env:
          OMNI_HOME: ${{ github.workspace }}/.omni

  test-c:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The test runner is voxgig/omni, consumed as a local checkout (it is
      # not published, and C has no registry to publish it to); the Makefile
      # finds it via OMNI_HOME. The library itself never depends on omni.
      - name: Checkout voxgig/omni (test runner)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: voxgig/omni
          path: .omni
          ref: ${{ env.OMNI_REF }}
      - name: Run tests
        working-directory: ./c
        run: make test
        env:
