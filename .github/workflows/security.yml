name: Security & Static Analysis

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  schedule:
    # Re-scan weekly so newly disclosed advisories are caught even without a push.
    - cron: '0 6 * * 1'

permissions:
  contents: read

env:
  # actions/checkout and the setup-* actions still bundle the deprecated
  # Node 20 runtime; opt them into Node 24 now (default from 2026-06-02).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ---- Repo-wide scans (one tool over the whole tree) ----

  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz" \
            | tar xz gitleaks && sudo mv gitleaks /usr/local/bin/
      - run: gitleaks detect --no-banner --redact --verbose

  dependencies:
    name: dependency scan (osv-scanner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 'stable'
      - run: |
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@latest
          "$(go env GOPATH)/bin/osv-scanner" scan --config=osv-scanner.toml --recursive .

  sast:
    name: SAST (semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: pip install semgrep
      - run: |
          # Excluded rules + rationale:
          # - c.lang.security.insecure-use-strcat-fn.insecure-use-strcat-fn:
          #   the C port appends to caller-allocated length-tracked buffers;
          #   strcat is the language-canonical idiom here. All 28 sites are
          #   bounded by the surrounding `vs_str_buf`/`vs_value*` length.
          # - c.lang.security.{double-free,use-after-free}: false positives
          #   on the inject-machinery's standard `vs_release` + `free` cleanup
          #   pattern; the SV is owned exclusively at those points.
          semgrep scan \
            --config p/security-audit \
            --config p/secrets \
            --exclude-rule c.lang.security.insecure-use-strcat-fn.insecure-use-strcat-fn \
            --exclude-rule c.lang.security.use-after-free.use-after-free \
            --exclude-rule c.lang.security.double-free.double-free \
            --metrics=off --error .

  workflows:
    name: workflow lint (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 'stable'
      - run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@latest
          "$(go env GOPATH)/bin/actionlint"

  shell:
    name: shell lint (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The runner image pre-configures third-party apt repos - Google Chrome
      # among them - that nothing in this repository installs from. When one
      # of those serves a briefly inconsistent index, `apt-get update` exits
      # 100 and takes the job with it: struct#117 died on
      # `dl.google.com/linux/chrome-stable ... Hash Sum mismatch`, in a
      # shellcheck job, in a server-side testing library.
      #
      # `|| true` because apt STILL WRITES every index it did fetch ("they
      # have been ignored, or old ones used instead"), so the install below
      # proceeds on a good Ubuntu archive index. If the archive itself failed,
      # the install fails loudly with the real reason rather than being
      # masked.
      #
      # NOT `-o Dir::Etc::sourceparts=/dev/null`: on Ubuntu 24.04 the MAIN
      # archive lives in sources.list.d/ubuntu.sources (deb822), so that flag
      # skips everything and `apt-get install` cannot find the package at all.
      # Verified: `E: Unable to locate package shellcheck`.
      - run: |
          sudo apt-get update || true
          sudo apt-get install -y shellcheck
      - run: git ls-files -z '*.sh' | xargs -0 -r shellcheck

  spelling:
    name: spell check (cspell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - run: npx --yes cspell --no-progress --no-summary --gitignore "**/*.md"

  markdown:
    name: markdown lint (markdownlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - run: npx --yes markdownlint-cli '**/*.md'

  parity:
    name: cross-port API parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python3 tools/check_parity.py

  omni-isolation:
    name: omni must not reach any shipped library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # THE OMNI CHECKOUT IS PRESENT ON PURPOSE, and it is what makes this
      # job mean something. Register 4.13's rule is about DECLARATION -
      # nothing a port's library manifest may name omni - but the proof it
      # originally prescribed was about RESOLUTION: build with the checkout
      # absent and see it fail. Those stopped being the same test. omni is a
      # public repo, so `github.com/voxgig/omni/go` resolves from
      # proxy.golang.org with no tags at all: `go mod tidy` in a module with
      # no checkout anywhere still writes the require line. A checkout-absent
      # build can now go green while proving nothing. That hole is Go's
      # specifically - rust, swift, dart, haskell and lean name omni by a
      # literal path, which cannot fall back - but the declaration check
      # earns its place in every port for a separate reason: it catches an
      # omni import at the commit that introduces it, not at the tidy that
      # publishes it.
      #
      # So this job does the opposite of the old one. It makes omni as
      # resolvable as it can be and then asserts the manifests still declare
      # nothing - a check that cannot pass by accident of omni being missing.
      - name: Check out voxgig/omni beside the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: voxgig/omni
          path: .omni
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Library manifests must not declare omni
        env:
          OMNI_HOME: ${{ github.workspace }}/.omni
        run: python3 tools/omni_isolation.py
      # A guard that has never failed is not a guard. This injects a 4.13
      # violation into every port - manifest and shipped source - and requires
      # each to be caught, plus two deliberately exempt blocks that must NOT
      # fire. It found three dead globs when the checker was written.
      - name: The guard must catch what it claims to
        run: python3 tools/omni_isolation_selftest.py

  docs-examples:
    name: documentation examples match corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      # 1. every anchored example binds to a tested corpus entry and its declared
      #    output matches. 2. every anchor has an up-to-date canonical marker
      #    (the generator would not change anything).
      - run: python3 tools/check_doc_examples.py
      - run: python3 tools/gen_doc_examples.py --check

  corpus-freshness:
    name: corpus regenerates from *.aon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Recompile build/test/test.json from the *.aon sources
        working-directory: ./build
        run: |
          npm install --no-audit --no-fund
          npm run test-model
      - name: Fail if the committed test.json is stale
        run: git diff --exit-code build/test/test.json

  # ---- Per-language dependency / security audits ----

  audit-typescript:
    name: audit (typescript — npm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - working-directory: ./typescript
        run: npm install --package-lock-only && make audit

  audit-javascript:
    name: audit (javascript — npm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - working-directory: ./javascript
        run: npm install --package-lock-only && make audit

  audit-python:
    name: audit (python — pip-audit + bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: pip install pip-audit bandit
      - working-directory: ./python
        run: make audit

  audit-go:
    name: audit (go — govulncheck + gosec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The test package imports voxgig/omni, consumed as a local checkout (it
      # is not published); the Makefile's `go.work` target finds it via
      # OMNI_HOME. The library itself never depends on omni.
      - name: Checkout voxgig/omni (test runner)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: voxgig/omni
          path: .omni
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 'stable'
      - run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/securego/gosec/v2/cmd/gosec@latest
      - working-directory: ./go
        env:
          OMNI_HOME: ${{ github.workspace }}/.omni
        run: |
          gobin="$(go env GOPATH)/bin"
          PATH="$gobin:$PATH" make audit

  audit-ruby:
    name: audit (ruby — bundler-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ./ruby
      - working-directory: ./ruby
        run: gem install bundler-audit && make audit

  audit-php:
    name: audit (php — composer audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
      - working-directory: ./php
        # Fresh COMPOSER_HOME: avoids the malformed github-oauth token that
        # setup-php intermittently writes to its auth.json.
        run: composer install && make audit
        env:
          COMPOSER_HOME: ${{ runner.temp }}/composer-home

  audit-rust:
    name: audit (rust — cargo audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - run: cargo install cargo-audit --locked
      - working-directory: ./rust
        run: make audit

  audit-csharp:
    name: audit (csharp — dotnet list --vulnerable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '8.0.x'
      - working-directory: ./csharp
        run: make audit
