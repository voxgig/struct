# Releases the three voxgig/struct packages that publish over OIDC, and
# writes their git tags: `@voxgig/struct` on npm (from `typescript/`),
# `@voxgig/struct-js` on npm (from `javascript/`), and `voxgig-struct` on
# crates.io (from `rust/`).
#
# Adapted from voxgig/sdkgen's publish.yml, which carries the reasoning for
# every guard below. BOTH registries' trusted publishers are registered
# against THIS filename (publish.yml) or the OIDC exchange is rejected.
#
# ONE FILE, BECAUSE EACH REGISTRY ALLOWS EXACTLY ONE. A trusted publisher is
# registered against a single workflow FILENAME — on npmjs.com for every
# @voxgig package, on crates.io for `voxgig-struct` — and all three are
# registered against `publish.yml`. The name itself is arbitrary — other orgs register
# `release.yml` — but only the ONE registered file can publish, so anything
# that must accompany a publish has to live inside it. Here that is the tag,
# and now a second registry.
#
# A second workflow cannot publish whatever permissions it holds. npm rejects
# the exchange and reports it as
#
#   npm error 404 Not Found - PUT https://registry.npmjs.org/...
#
# — a 404, not a 403, so as not to leak whether the package exists. crates.io
# fails earlier and more plainly: the token exchange in
# `rust-lang/crates-io-auth-action` fails and `cargo publish` never runs.
#
# ONE TARGET PER RUN. The three packages version independently (typescript
# is 0.3.x, javascript and rust are 0.1.x) and every publish is
# irreversible, so a dispatch releases exactly ONE of them.
#
# TARGETS ARE NAMED BY PORT, not by registry: `typescript`, `javascript`,
# `rust`. Two of the three publish to npm, so the old `npm` name stopped
# identifying anything the moment the second one arrived. That is also how
# the rest of the repository names them -- PUBLISH_LANGS, `make
# publish-<lang>`, and the `<lang>/v*` tags.
#
# TWO JOBS PER TARGET, BECAUSE THEY NEED DIFFERENT PRIVILEGES.
#
#   publish, publish-javascript, publish-rust
#                          id-token: write, contents: READ. Run the install,
#                          the build and the tests — i.e. dependency lifecycle
#                          scripts and project code.
#   tag, tag-javascript, tag-rust
#                          contents: write. Run git and nothing else.
#
# Keeping them in one job would hand a repository-write credential to every
# dependency postinstall script that runs during the install, because checkout
# persists its token into the git config for the whole job. `cargo publish`
# has the same exposure: it compiles the dependency graph, build scripts and
# proc macros included.
#
# A ref pushed with GITHUB_TOKEN does NOT start another workflow run (GitHub
# suppresses that so workflows cannot trigger themselves), so the tag jobs
# cannot be replaced by "tag and let the publisher fire on it".
#
# THREE WAYS IN:
#
#   workflow_dispatch        the normal path. Publishes if missing, then tags.
#   push: tags typescript/v* the manual path, for a tag pushed by hand.
#                            Publishes @voxgig/struct only.
#   push: tags javascript/v* the same, for @voxgig/struct-js.
#   push: tags rust/v*       the same, for the crate.
#
# A `*` in a ref filter does not cross `/`, so the three push paths never
# overlap. The tag jobs do not run on a push.
#
# EVERY PORT TAGS AS `<lang>/v<version>`, TYPESCRIPT INCLUDED. It released
# under a BARE `v<version>` up to 0.3.4, and the 16 bare tags in this repo are
# that history. One port with its own scheme cost more than it saved: the tag
# is the repository's release marker, `tools/release_status.py` reads one by
# matching `^([a-z+]+)/v`, and a bare tag does not match -- so the dashboard
# silently dropped every typescript release and reported the port at
# `typescript/v0.2.1`, a stale tag from a Makefile publish, while 0.3.4 was
# live on npm. `tools/bump.py` carried a special case for the same reason.
# Both are gone now; the port name is in the tag, as it is in the sibling
# repositories.
#
# THE BARE TAGS STAY. They are what `v0.3.4` and its fifteen predecessors were
# released under, and rewriting a published release marker to tidy a scheme
# would be worse than the inconsistency. The new scheme therefore starts at
# the first release cut after this change, and the two namespaces sit side by
# side: everything up to `v0.3.4` bare, everything after it under
# `typescript/v`. `tools/bump.py` reads the new prefix and falls back to the
# bare one for a version the new namespace does not carry, so 0.3.4 still
# reads as released and the next bump is 0.3.5. Without that bridge it would
# read 0.3.4 as unreleased and cut `typescript/v0.3.4` at whatever commit
# main was on -- a tag the gitHead guard below then refuses, left behind for
# the dashboard to read as a release.
#
# DRY RUN. `dry_run: true` on a dispatch rehearses a release without making
# one: every guard and every test runs, the artifact is packed with
# `--dry-run`, nothing is published and nothing is tagged. For rust it also
# mints and immediately revokes a real crates.io token, which is the ONLY way
# to prove the registry-side trusted publisher is configured correctly —
# short of burning a version number to find out.
#
# It is therefore the one path allowed off `main`. That is deliberate, and the
# cost is bounded: dispatching at all requires repository write, the minted
# token can only publish this one crate, the action masks it in the log and
# revokes it in its post step, and no publish or tag step can run in the same
# breath. Weigh that against the alternative, which is that the trusted
# publisher can only ever be tested by an irreversible release.
#
# VERSION BUMPS ARE NOT AUTOMATED, deliberately. Nothing here commits. It
# reads the version already on the branch and releases exactly that, so the
# bump stays a reviewable diff and the release stays a button.
#
#   typescript/package.json "version" -> tag typescript/v<version>
#   javascript/package.json "version" -> tag javascript/v<version>
#   rust/Cargo.toml         version   -> tag rust/v<version>
#
# Renaming this file breaks publishing until BOTH registries' trusted
# publishers are updated to match. Do NOT publish locally over a token: that
# bypasses OIDC and its provenance attestation entirely.
#
# @voxgig/struct-js HAS NEVER PUBLISHED OVER OIDC. The port was renamed from
# @voxgig/structjs, and npm registers a trusted publisher only against a
# package that already exists, so 0.1.2 went out as one plain token publish:
# it sits on npm under a person's name with no provenance attestation, while
# @voxgig/struct@0.3.4 carries one. A `target: javascript` dispatch on
# 2026-09-03 failed the OIDC exchange all the same, reported as exactly the
# 404 above -- tests passed, the tarball packed, the PUT was rejected. Until
# a publisher for @voxgig/struct-js is registered against THIS repository and
# THIS filename on the package's npm settings page, that dispatch cannot
# succeed. The registration is what to check, not the workflow.

name: publish

on:
  push:
    tags: ['typescript/v*', 'javascript/v*', 'rust/v*']
  workflow_dispatch:
    inputs:
      target:
        description: 'Which port to release'
        type: choice
        options: [typescript, javascript, rust]
        default: typescript
      expect_sha:
        description: 'Optional: refuse unless main is still at this commit (set by `make publish`)'
        type: string
        default: ''
      dry_run:
        description: 'Rehearse only: run every guard and test, publish nothing, tag nothing'
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # The corpus runner for the javascript port, pinned to the same commit
  # build.yml checks out. The library never depends on omni; only the tests
  # this job runs before publishing do.
  OMNI_REF: fbf1da64e3c90fc54e3c6b237b0b5835890df8c4

jobs:
  publish:
    name: npm publish (typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # `target` picks the package on a dispatch; the tag prefix picks it on a
    # push. Without this the crate's `rust/v*` tag would also start an npm
    # release of whatever typescript/package.json happens to say.
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' && inputs.target == 'typescript')
       || (github.event_name == 'push' && startsWith(github.ref_name, 'typescript/v')) }}

    # Deliberately NOT contents: write — see the header. This job runs
    # dependency lifecycle scripts.
    permissions:
      id-token: write
      contents: read

    outputs:
      version: ${{ steps.versions.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'

      - name: Resolve the version being released
        id: versions
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./typescript/package.json').version")"
          test -n "$VERSION" || { echo "::error::could not read typescript/package.json version"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "$VERSION -> tag typescript/v$VERSION"

      # RELEASES COME FROM main, INCLUDING FROM THE BUTTON. `gh workflow run
      # --ref` accepts any branch or tag, and the Makefile's `main` guard only
      # binds callers who went through `make publish` — so without this the
      # Actions UI or a stray API call could publish and tag a feature branch,
      # irreversibly.
      #
      # Exempting `dry_run` is safe for the reason the header gives: it reaches
      # no publish step and no tag job, so a feature branch can rehearse but
      # cannot release.
      - name: Dispatches must come from main
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::dispatch ref is $GITHUB_REF_NAME; releases must come from main"
            exit 1
          fi

      # `--ref main` names a MUTABLE branch, so between `make publish` pushing
      # the release commit and this run resolving, another commit can land and
      # be published under the version just bumped. `make publish` passes the
      # SHA it pushed; if main has moved since, stop rather than release
      # something nobody asked for.
      - name: main must still be the commit we intended to release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.expect_sha != '' }}
        env:
          EXPECT_SHA: ${{ inputs.expect_sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_SHA" != "$EXPECT_SHA" ]; then
            echo "::error::main has moved: expected $EXPECT_SHA, got $GITHUB_SHA"
            exit 1
          fi

      # A tag pushed by hand must agree with the version it claims to release.
      # Without this, pushing typescript/v1.2.3 while typescript/package.json
      # still says 1.2.2 resolves 1.2.2, finds it already published, skips the
      # publish, and the run goes GREEN — leaving a tag with no release behind
      # it.
      - name: The pushed tag must match the package version
        if: ${{ github.event_name == 'push' }}
        env:
          PKG_VERSION: ${{ steps.versions.outputs.version }}
        run: |
          set -euo pipefail
          WANT="typescript/v$PKG_VERSION"
          if [ "$GITHUB_REF_NAME" != "$WANT" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match typescript/package.json ($WANT)"
            exit 1
          fi

      # AN EXISTING TAG IS ONLY A PROBLEM IF IT POINTS SOMEWHERE ELSE. A tag
      # already on this commit is the idempotent case — nothing to create, not
      # an error — which is what lets a partly-failed release be re-dispatched.
      #
      # A REHEARSAL WARNS WHERE A RELEASE STOPS. This guard and the registry
      # one below ask "does the world already contain this version", and at
      # the moment you most want to rehearse — publish.yml just changed, the
      # manifest still says the version last released — the honest answer is
      # yes. Failing there would mean no rehearsal without a bump first, which
      # is exactly the friction that stops people rehearsing at all.
      - name: Refuse a tag that points at a different commit
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          PKG_VERSION: ${{ steps.versions.outputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          TAG="typescript/v$PKG_VERSION"
          HEAD_SHA="$(git rev-parse HEAD)"
          AT="$(git rev-parse -q --verify "refs/tags/$TAG^{commit}" 2>/dev/null || true)"
          if [ -n "$AT" ] && [ "$AT" != "$HEAD_SHA" ]; then
            MSG="tag $TAG already exists on $AT, not this commit — bump typescript/package.json"
            if [ "${DRY_RUN:-false}" = "true" ]; then
              echo "::warning::$MSG (rehearsal: a real release stops here)"
            else
              echo "::error::$MSG"
              exit 1
            fi
          fi
          if [ -n "$AT" ]; then echo "$TAG already points here; nothing to create"; fi

      # INSTALL FIRST. The pre-flight below runs `node build/check-model.js`,
      # which requires aontu — so with the install after it, the pre-flight
      # died on "Cannot find module 'aontu'" and no release using this
      # workflow could ever reach the publish step. Fail-fast ordering is only
      # worth having when the fast step can actually run.
      #
      # `npm install`, NOT `npm ci`, for the reason build.yml already gives at
      # its own install step: this repo gitignores package-lock.json
      # (.gitignore:150) and commits no lockfile in any port, so `npm ci` has
      # nothing to install from and exits 1 before doing anything. That is not
      # hypothetical - it is how the first ever run of this workflow failed,
      # 17 seconds in. The workflow was adapted from voxgig/sdkgen, which does
      # commit lockfiles; struct does not.
      #
      # Nothing about the PUBLISHED artifact loosens by this: `dependencies` in
      # typescript/package.json is EMPTY - the package ships with no runtime
      # deps at all - so everything installed here is build, lint and test
      # tooling that never reaches the tarball, and @voxgig/omni among it is
      # pinned to an exact version rather than a range.
      - name: Install dependencies
        working-directory: typescript
        run: npm install


      - name: Build and test
        working-directory: typescript
        run: |
          npm run build
          npm test

      # Trusted publishing requires npm >= 11.5.1.
      - name: Use a trusted-publishing capable npm
        run: npm install -g npm@latest

      # THE REGISTRY IS THE SOURCE OF TRUTH FOR "IS THIS RELEASED", not the
      # tag. A run can publish and then fail before tagging, leaving a version
      # on npm with nothing pointing at it. Without this check that state is
      # unrecoverable: the publish step dies on "cannot publish over the
      # previously published versions" before the tag job ever runs.
      - name: Is this version already on npm?
        id: registry
        env:
          PKG_VERSION: ${{ steps.versions.outputs.version }}
        run: |
          set -euo pipefail
          V="$PKG_VERSION"
          if npm view "@voxgig/struct@$V" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$V is already on npm — skipping publish"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "$V is not on npm — will publish"
          fi

      # SKIPPING THE PUBLISH ASSUMES "SAME VERSION MEANS SAME CODE". That holds
      # only if main has not moved. Publish succeeds at commit A, the tag job
      # fails, main advances to B, someone re-dispatches: the version is still
      # on npm, so the publish is skipped and B gets tagged — while the
      # registry artifact was built from A. The tag would then point at code
      # the published package does not contain.
      #
      # npm records the source commit as `gitHead`, so this is checkable.
      # Absent gitHead (an old or non-git publish) cannot be verified, so warn
      # rather than block — refusing would make legitimate recovery impossible.
      - name: A published version must come from this commit
        if: ${{ steps.registry.outputs.published == 'true' }}
        env:
          PKG_VERSION: ${{ steps.versions.outputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          V="$PKG_VERSION"
          GH="$(npm view "@voxgig/struct@$V" gitHead 2>/dev/null || true)"
          if [ -z "$GH" ]; then
            echo "::warning::npm records no gitHead for $V; cannot verify it was built from this commit"
          elif [ "$GH" != "$GITHUB_SHA" ]; then
            MSG="npm has $V built from $GH, but this run is $GITHUB_SHA — tagging would point at code the registry does not contain"
            if [ "${DRY_RUN:-false}" = "true" ]; then
              echo "::warning::$MSG (rehearsal: a real release stops here)"
            else
              echo "::error::$MSG"
              exit 1
            fi
          else
            echo "$V on npm was built from this commit"
          fi

      # Publish BEFORE tagging (the tag job `needs` this one), so a tag only
      # ever exists for a release that reached the registry.
      - name: Publish to npm
        if: ${{ steps.registry.outputs.published == 'false' && !inputs.dry_run }}
        working-directory: typescript
        env:
          PKG_VERSION: ${{ steps.versions.outputs.version }}
        run: |
          set -euo pipefail
          V="$PKG_VERSION"
          # A PRERELEASE MUST NOT BECOME `latest`. `npm publish` defaults to
          # the latest dist-tag, so publishing 1.2.3-beta.1 that way hands it
          # to every unpinned install.
          case "$V" in
            *-*) DIST=next ;;
            *)   DIST=latest ;;
          esac
          echo "publishing $V under dist-tag $DIST"
          npm publish --access public --tag "$DIST"

      # The npm side of a rehearsal packs the tarball and stops. It cannot
      # prove npm's trusted publisher works — that exchange happens inside a
      # real `npm publish` — so this checks the artifact, not the credential.
      - name: Rehearse the npm package
        if: ${{ inputs.dry_run }}
        working-directory: typescript
        run: npm publish --access public --dry-run

  # Runs git and nothing else. No npm install, no project code — so the
  # repository-write credential is never in scope while third-party code runs.
  tag:
    name: tag (typescript)
    needs: publish
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'typescript' && !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Tag the release
        env:
          PKG_VERSION: ${{ needs.publish.outputs.version }}
        run: |
          set -euo pipefail
          TAG="typescript/v$PKG_VERSION"
          HEAD_SHA="$(git rev-parse HEAD)"

          # EXISTENCE IS NOT ENOUGH. `git rev-parse --verify` only asks whether
          # the name resolves; a tag created between the publish job's guard
          # and this checkout could point anywhere. Treating that as the
          # idempotent case would leave a green run with an npm artifact from
          # THIS commit and a release tag on a different one. Dereference and
          # compare.
          AT="$(git rev-parse -q --verify "refs/tags/$TAG^{commit}" 2>/dev/null || true)"
          if [ -n "$AT" ]; then
            if [ "$AT" != "$HEAD_SHA" ]; then
              echo "::error::$TAG exists on $AT, not this commit ($HEAD_SHA)"
              exit 1
            fi
            echo "$TAG already points here — nothing to do" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git tag "$TAG"
          git push origin "refs/tags/$TAG"
          echo "pushed $TAG" >> "$GITHUB_STEP_SUMMARY"

  # THE SECOND NPM PACKAGE. Same shape as the typescript job above; the
  # differences are that this port has no build step and that its tests need
  # the omni corpus runner as a checkout rather than a devDependency.
  publish-javascript:
    name: npm publish (javascript)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    if: >-
      ${{ (github.event_name == 'workflow_dispatch' && inputs.target == 'javascript')
       || (github.event_name == 'push' && startsWith(github.ref_name, 'javascript/v')) }}

    # Deliberately NOT contents: write — see the header. This job runs
    # dependency lifecycle scripts.
    permissions:
      id-token: write
      contents: read

    outputs:
      version: ${{ steps.versions.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'

      # The corpus runner is voxgig/omni, consumed as a local checkout: unlike
      # the typescript port, this one does not take it from npm. The library
      # never depends on it -- only the tests below do, and they find it
      # through OMNI_HOME.
      - name: Checkout voxgig/omni (test runner)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: voxgig/omni
          path: .omni
          ref: ${{ env.OMNI_REF }}

      - name: Resolve the version being released
        id: versions
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./javascript/package.json').version")"
          test -n "$VERSION" || { echo "::error::could not read javascript/package.json version"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "$VERSION -> tag javascript/v$VERSION"

      - name: Dispatches must come from main
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::dispatch ref is $GITHUB_REF_NAME; releases must come from main"
            exit 1
          fi

      - name: main must still be the commit we intended to release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.expect_sha != '' }}
        env:
          EXPECT_SHA: ${{ inputs.expect_sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_SHA" != "$EXPECT_SHA" ]; then
            echo "::error::main has moved: expected $EXPECT_SHA, got $GITHUB_SHA"
            exit 1
          fi

      - name: The pushed tag must match the package version
        if: ${{ github.event_name == 'push' }}
        env:
          PKG_VERSION: ${{ steps.versions.outputs.version }}
        run: |
          set -euo pipefail
          WANT="javascript/v$PKG_VERSION"
          if [ "$GITHUB_REF_NAME" != "$WANT" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match javascript/package.json ($WANT)"
            exit 1
          fi

      # Warns rather than stops on a rehearsal — see the typescript job's copy
      # of this step for why.
      - name: Refuse a tag that points at a different commit
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          PKG_VERSION: ${{ steps.versions.outputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          TAG="javascript/v$PKG_VERSION"
          HEAD_SHA="$(git rev-parse HEAD)"
          AT="$(git rev-parse -q --verify "refs/tags/$TAG^{commit}" 2>/dev/null || true)"
          if [ -n "$AT" ] && [ "$AT" != "$HEAD_SHA" ]; then
            MSG="tag $TAG already exists on $AT, not this commit — bump javascript/package.json"
            if [ "${DRY_RUN:-false}" = "true" ]; then
              echo "::warning::$MSG (rehearsal: a real release stops here)"
            else
              echo "::error::$MSG"
              exit 1
            fi
          fi
          if [ -n "$AT" ]; then echo "$TAG already points here; nothing to create"; fi

      # `npm install`, NOT `npm ci`: this repo commits no lockfile in any port
      # (.gitignore), so `npm ci` has nothing to install from. Nothing about
      # the PUBLISHED artifact loosens by that -- `dependencies` here is
      # EMPTY, so everything installed is lint and test tooling that never
      # reaches the tarball.
      #
      # NO BUILD STEP. This port ships `src/struct.js` as written; its
      # Makefile says so, and the package `files` list is LICENSE and src.
      - name: Install dependencies
        working-directory: javascript
        run: npm install

      - name: Test
        working-directory: javascript
        run: npm test
        env:
          OMNI_HOME: ${{ github.workspace }}/.omni

      # Trusted publishing requires npm >= 11.5.1.
      - name: Use a trusted-publishing capable npm
        run: npm install -g npm@latest

      - name: Is this version already on npm?
        id: registry
        env:
          PKG_VERSION: ${{ steps.versions.outputs.version }}
        run: |
          set -euo pipefail
          V="$PKG_VERSION"
          if npm view "@voxgig/struct-js@$V" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$V is already on npm — skipping publish"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "$V is not on npm — will publish"
          fi

      - name: A published version must come from this commit
        if: ${{ steps.registry.outputs.published == 'true' }}
        env:
          PKG_VERSION: ${{ steps.versions.outputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          V="$PKG_VERSION"
          GH="$(npm view "@voxgig/struct-js@$V" gitHead 2>/dev/null || true)"
          if [ -z "$GH" ]; then
            echo "::warning::npm records no gitHead for $V; cannot verify it was built from this commit"
          elif [ "$GH" != "$GITHUB_SHA" ]; then
            MSG="npm has $V built from $GH, but this run is $GITHUB_SHA — tagging would point at code the registry does not contain"
            if [ "${DRY_RUN:-false}" = "true" ]; then
              echo "::warning::$MSG (rehearsal: a real release stops here)"
            else
              echo "::error::$MSG"
              exit 1
            fi
          else
            echo "$V on npm was built from this commit"
          fi

      # Publish BEFORE tagging (the tag job `needs` this one), so a tag only
      # ever exists for a release that reached the registry.
      - name: Publish to npm
        if: ${{ steps.registry.outputs.published == 'false' && !inputs.dry_run }}
        working-directory: javascript
        env:
          PKG_VERSION: ${{ steps.versions.outputs.version }}
        run: |
          set -euo pipefail
          V="$PKG_VERSION"
          # A PRERELEASE MUST NOT BECOME `latest` — see the typescript job.
          case "$V" in
            *-*) DIST=next ;;
            *)   DIST=latest ;;
          esac
          echo "publishing $V under dist-tag $DIST"
          npm publish --access public --tag "$DIST"

      - name: Rehearse the npm package
        if: ${{ inputs.dry_run }}
        working-directory: javascript
        run: npm publish --access public --dry-run

  # Runs git and nothing else — see the `tag` job above, which this mirrors.
  tag-javascript:
    name: tag (javascript)
    needs: publish-javascript
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'javascript' && !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Tag the release
        env:
          PKG_VERSION: ${{ needs.publish-javascript.outputs.version }}
        run: |
          set -euo pipefail
          TAG="javascript/v$PKG_VERSION"
          HEAD_SHA="$(git rev-parse HEAD)"

          # EXISTENCE IS NOT ENOUGH — dereference and compare, for the reason
          # spelled out in the typescript tag job.
          AT="$(git rev-parse -q --verify "refs/tags/$TAG^{commit}" 2>/dev/null || true)"
          if [ -n "$AT" ]; then
            if [ "$AT" != "$HEAD_SHA" ]; then
              echo "::error::$TAG exists on $AT, not this commit ($HEAD_SHA)"
              exit 1
            fi
            echo "$TAG already points here — nothing to do" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git tag "$TAG"
          git push origin "refs/tags/$TAG"
          echo "pushed $TAG" >> "$GITHUB_STEP_SUMMARY"


  # THE CRATE. Same shape as the npm job above, and the differences are all
  # registry differences, called out where they occur.
  publish-rust:
    name: crates.io publish
    runs-on: ubuntu-latest
    timeout-minutes: 30

    if: >-
      ${{ (github.event_name == 'workflow_dispatch' && inputs.target == 'rust')
       || (github.event_name == 'push' && startsWith(github.ref_name, 'rust/v')) }}

    # Deliberately NOT contents: write — see the header. `cargo publish`
    # compiles the whole dependency graph, build scripts and proc macros
    # included, which is third-party code executing on this runner.
    permissions:
      id-token: write
      contents: read

    outputs:
      version: ${{ steps.versions.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      # THE SAME EXPRESSION `rust/Makefile` USES, so the two cannot disagree
      # about which version a release is. `-m1` stops at `[package]`'s own
      # `version`, before any dependency's.
      - name: Resolve the version being released
        id: versions
        working-directory: rust
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          test -n "$VERSION" || { echo "::error::could not read rust/Cargo.toml version"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "$VERSION -> tag rust/v$VERSION"

      - name: Dispatches must come from main
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::dispatch ref is $GITHUB_REF_NAME; releases must come from main"
            exit 1
          fi

      - name: main must still be the commit we intended to release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.expect_sha != '' }}
        env:
          EXPECT_SHA: ${{ inputs.expect_sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_SHA" != "$EXPECT_SHA" ]; then
            echo "::error::main has moved: expected $EXPECT_SHA, got $GITHUB_SHA"
            exit 1
          fi

      - name: The pushed tag must match the crate version
        if: ${{ github.event_name == 'push' }}
        env:
          CRATE_VERSION: ${{ steps.versions.outputs.version }}
        run: |
          set -euo pipefail
          WANT="rust/v$CRATE_VERSION"
          if [ "$GITHUB_REF_NAME" != "$WANT" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match rust/Cargo.toml ($WANT)"
            exit 1
          fi

      # Warns rather than stops on a rehearsal — see the npm job's copy of
      # this step for why.
      - name: Refuse a tag that points at a different commit
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          CRATE_VERSION: ${{ steps.versions.outputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          TAG="rust/v$CRATE_VERSION"
          HEAD_SHA="$(git rev-parse HEAD)"
          AT="$(git rev-parse -q --verify "refs/tags/$TAG^{commit}" 2>/dev/null || true)"
          if [ -n "$AT" ] && [ "$AT" != "$HEAD_SHA" ]; then
            MSG="tag $TAG already exists on $AT, not this commit — bump rust/Cargo.toml"
            if [ "${DRY_RUN:-false}" = "true" ]; then
              echo "::warning::$MSG (rehearsal: a real release stops here)"
            else
              echo "::error::$MSG"
              exit 1
            fi
          fi
          if [ -n "$AT" ]; then echo "$TAG already points here; nothing to create"; fi

      # No install step, because there is nothing to install: the library has
      # ZERO runtime dependencies and one dev-dependency (serde_json, for the
      # corpus loader). `cargo test` resolves what it needs.
      - name: Build and test
        working-directory: rust
        run: |
          cargo build --all-targets
          cargo test

      # THE CORPUS IS THE CONTRACT, and `cargo test` in `rust/` does not run
      # it. The harness is a separate package precisely so that omni stays out
      # of the PUBLISHED manifest (register 4.13) — which also means the
      # library's own test run says nothing about port parity. Publishing
      # without this would ship a port nobody checked against the canonical.
      - name: Run the corpus
        working-directory: rust/corpus
        run: cargo test

      # THE REGISTRY IS THE SOURCE OF TRUTH FOR "IS THIS RELEASED", not the
      # tag — same reasoning as the npm job's equivalent step: a run can
      # publish and then fail before tagging, and without this that state is
      # unrecoverable.
      #
      # crates.io answers 404 for a version it does not have and 403 to a
      # request with no descriptive User-Agent, so both are spelled out. Any
      # other status is a registry the workflow does not understand; stopping
      # beats guessing "not published" and trying to publish over it.
      - name: Is this version already on crates.io?
        id: registry
        env:
          CRATE_VERSION: ${{ steps.versions.outputs.version }}
        run: |
          set -euo pipefail
          V="$CRATE_VERSION"
          CODE="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H 'User-Agent: voxgig-struct release workflow (https://github.com/voxgig/struct)' \
            "https://crates.io/api/v1/crates/voxgig-struct/$V")"
          case "$CODE" in
            200)
              echo "published=true" >> "$GITHUB_OUTPUT"
              echo "$V is already on crates.io — skipping publish"
              ;;
            404)
              echo "published=false" >> "$GITHUB_OUTPUT"
              echo "$V is not on crates.io — will publish"
              ;;
            *)
              echo "::error::crates.io answered $CODE for voxgig-struct/$V; refusing to guess"
              exit 1
              ;;
          esac

      # SKIPPING THE PUBLISH ASSUMES "SAME VERSION MEANS SAME CODE" — the npm
      # job's step of this name explains why that can be false and how it ends
      # with a tag pointing at code the registry does not contain.
      #
      # crates.io records no `gitHead`, but a version published over trusted
      # publishing carries `trustpub_data.sha`, which is the commit that
      # published it. That is the same check by another name. A version
      # published over a token has `trustpub_data: null` and cannot be
      # verified — 0.1.0 is exactly that — so warn rather than block, or
      # legitimate recovery becomes impossible.
      - name: A published version must come from this commit
        if: ${{ steps.registry.outputs.published == 'true' }}
        env:
          CRATE_VERSION: ${{ steps.versions.outputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          V="$CRATE_VERSION"
          SHA="$(curl -sS \
            -H 'User-Agent: voxgig-struct release workflow (https://github.com/voxgig/struct)' \
            "https://crates.io/api/v1/crates/voxgig-struct/$V" \
            | python3 -c 'import json,sys; v=json.load(sys.stdin).get("version") or {}; t=v.get("trustpub_data") or {}; print(t.get("sha",""))')"
          if [ -z "$SHA" ]; then
            echo "::warning::crates.io records no trusted-publishing commit for $V; cannot verify it was built from this commit"
          elif [ "$SHA" != "$GITHUB_SHA" ]; then
            MSG="crates.io has $V published from $SHA, but this run is $GITHUB_SHA — tagging would point at code the registry does not contain"
            if [ "${DRY_RUN:-false}" = "true" ]; then
              echo "::warning::$MSG (rehearsal: a real release stops here)"
            else
              echo "::error::$MSG"
              exit 1
            fi
          else
            echo "$V on crates.io was published from this commit"
          fi

      # OIDC -> a crates.io token that lives ~30 minutes. AFTER the build and
      # the tests deliberately: minting it first would spend most of its life
      # compiling. The action masks the token in the log and revokes it in its
      # post step, so it does not outlive the job even on failure.
      #
      # This step runs on a rehearsal too — it is the whole point of one. The
      # registry-side trusted publisher (owner, repo, and THIS filename) is not
      # observable any other way, and a misconfiguration surfaces here rather
      # than after a version number has been spent.
      - name: Mint a crates.io token over OIDC
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      # Publish BEFORE tagging (the tag job `needs` this one), so a tag only
      # ever exists for a release that reached the registry.
      #
      # No dist-tag to choose, unlike npm: crates.io has none. Cargo's semver
      # ranges already exclude prereleases unless a caller opts in, so
      # 0.1.1-beta.1 cannot reach an unpinned dependent by accident.
      - name: Publish to crates.io
        if: ${{ steps.registry.outputs.published == 'false' && !inputs.dry_run }}
        working-directory: rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish

      # Packs and verifies exactly what `cargo publish` would upload, and
      # uploads nothing. Reaching this step at all means the token exchange
      # above succeeded, which is the half a rehearsal exists to prove.
      - name: Rehearse the crate
        if: ${{ inputs.dry_run }}
        working-directory: rust
        run: cargo publish --dry-run

  # Runs git and nothing else — see the `tag` job above, which this mirrors.
  tag-rust:
    name: tag (rust)
    needs: publish-rust
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'rust' && !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Tag the release
        env:
          CRATE_VERSION: ${{ needs.publish-rust.outputs.version }}
        run: |
          set -euo pipefail
          TAG="rust/v$CRATE_VERSION"
          HEAD_SHA="$(git rev-parse HEAD)"

          # EXISTENCE IS NOT ENOUGH — dereference and compare, for the reason
          # spelled out in the npm tag job.
          AT="$(git rev-parse -q --verify "refs/tags/$TAG^{commit}" 2>/dev/null || true)"
          if [ -n "$AT" ]; then
            if [ "$AT" != "$HEAD_SHA" ]; then
              echo "::error::$TAG exists on $AT, not this commit ($HEAD_SHA)"
              exit 1
            fi
            echo "$TAG already points here — nothing to do" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git tag "$TAG"
          git push origin "refs/tags/$TAG"
          echo "pushed $TAG" >> "$GITHUB_STEP_SUMMARY"
